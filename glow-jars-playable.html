// ---------- 상태 ----------
var state = "boot", endReason = "", jars = [], sel = -1, selT = 0, fly = null, moves = 0, tapCount = 0;
var T = 0, lastInput = 0, startT = 0, winT = 0, hint = null;
var shake = [-1e9, -1e9, -1e9, -1e9], bump = [-1e9, -1e9, -1e9, -1e9], doneT = [-1, -1, -1, -1];
var particles = [], popups = [];
var starRng = mulberry32(77), stars = [], motes = [];
for (var i = 0; i < 46; i++) stars.push({ x: starRng() * W, y: starRng() * 300, r: 0.6 + starRng() * 1.5, p: starRng() * 6.28 });
for (i = 0; i < 9; i++) motes.push({ x: starRng() * W, y: 120 + starRng() * 200, p: starRng() * 6.28, c: i % 3, s: 0.6 + starRng() * 0.6 });

function startLevel() {
  jars = LEVEL.map(function (s) { return s.split("").map(Number); });
  sel = -1; fly = null; moves = 0; tapCount = 0; endReason = ""; particles = []; popups = [];
  shake = [-1e9, -1e9, -1e9, -1e9]; bump = [-1e9, -1e9, -1e9, -1e9]; doneT = [-1, -1, -1, -1];
  lastInput = startT = T; hint = solve(jars).first;
  state = "play"; track("start");
}
function doneCount() { return jars.filter(isDone).length; }
function popup(x, y, text, color, size) { popups.push({ x: x, y: y, text: text, color: color, size: size, t0: T, life: 1000 }); }
function sparkle(x, y, color, n, power) {
  for (var k = 0; k < n; k++) {
    var a = Math.random() * 6.283, v = (0.04 + Math.random() * 0.16) * power;
    particles.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 0.04, g: 0.00012, r: 1.5 + Math.random() * 3, color: k % 4 ? color : CREAM, age: 0, life: 500 + Math.random() * 600 });
  }
}

function tapJar(j) {
  if (state !== "play" || fly) return;
  tapCount++;
  if (sel < 0) {
    if (jars[j].length && !isDone(jars[j])) { sel = j; selT = T; bell(520 + jars[j][jars[j].length - 1] * 90, 0.25, 0.06); }
    else { shake[j] = T; bell(150, 0.15, 0.05); }
    return;
  }
  if (j === sel) { sel = -1; bell(330, 0.15, 0.04); return; }
  if (canMove(jars, sel, j)) {
    var c = jars[sel].pop(), k = jars[j].length;
    fly = { c: c, s: sel, d: j, x0: JAR_X[sel], x1: JAR_X[j], y1: slotY(k), t0: T, dur: 360 };
    sel = -1; moves++;

  } else {
    shake[j] = T; bell(150, 0.15, 0.05);
    if (jars[j].length && !isDone(jars[j])) { sel = j; selT = T; } else sel = -1;
  }
}

function land() {
  var j = fly.d, c = fly.c;
  jars[j].push(c); bump[j] = T; fly = null;
  bell(392 + jars[j].length * 60, 0.3, 0.07);
  sparkle(JAR_X[j], slotY(jars[j].length - 1), COLS[c], 6, 0.6);

    setTimeout(function () { seq([523, 659, 784, 1047, 1319, 1568], 110, 0.08, 0.9); }, 350);
    for (var q = 0; q < 4; q++) if (jars[q].length) sparkle(JAR_X[q], JAR_TOP, COLS[jars[q][0]], 40, 2.2);
  } else hint = solve(jars).first;

document.getElementById("again").addEventListener("click", function () { track("replay"); unlockAudio(); bell(520, 0.2, 0.06); hideEnd(); startLevel(); });

// ---------- 갱신 ----------
function update(dt) {
  T += dt;
  if (fly && T - fly.t0 >= fly.dur) land();
  if (state === "play") {
    if (T - lastInput > IDLE_MS) showEnd("idle");
    else if (T - startT > MAX_PLAY_MS) showEnd("time");
    else if (tapCount >= MAX_TAPS && !fly) showEnd("taps");
  } else if (state === "win" && T - winT > END_DELAY_MS) showEnd("win");
  for (var k = particles.length - 1; k >= 0; k--) {
    var p = particles[k];
    p.age += dt;
    if (p.age >= p.life) { particles.splice(k, 1); continue; }
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (k = popups.length - 1; k >= 0; k--) if (T - popups[k].t0 > popups[k].life) popups.splice(k, 1);
}

  ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(92, 112, 120, 0, 6.283); ctx.fill();
  ctx.fillStyle = CREAM; ctx.beginPath(); ctx.arc(92, 112, 34, 0, 6.283); ctx.fill();

  ctx.beginPath(); ctx.arc(80, 104, 7, 0, 6.283); ctx.fill(); ctx.beginPath(); ctx.arc(102, 124, 5, 0, 6.283); ctx.fill(); ctx.beginPath(); ctx.arc(100, 98, 3, 0, 6.283); ctx.fill();

  ctx.fillStyle = "#171c44"; ctx.beginPath(); ctx.ellipse(360, 760, 320, 130, 0, 0, 6.283); ctx.fill();

// 유리병. x = 가운데, balls = 색 번호(아래→위), done = 완성(뚜껑·빛), lift = 맨 위 반딧불이 떠오른 정도(0~1)
function drawJar(c, x, balls, done, doneK, lift, active) {
  var l = x - JAR_W / 2, top = JAR_TOP, h = JAR_BOT - JAR_TOP, k;
  if (done) {

    hg.addColorStop(0, rgba(col, 0.42 * doneK)); hg.addColorStop(1, rgba(col, 0));

    if (isTop && lift > 0) y = lerp(y, HOVER_Y, lift);

function drawHand(x, y, press) {

function hintJar() {

}

    ctx.fillStyle = "rgba(0,0,0,.3)"; rr(bx, 656, tw, 42, 21); ctx.fill();
    ctx.fillStyle = CREAM; rr(bx, 652, tw, 42, 21); ctx.fill();
    ctx.fillStyle = INK; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(txt, bx + tw / 2, 674);

function drawFx() {

  });

function draw() {
  drawBg();
  var won = state === "win" || endReason === "win", wt = won ? T - winT : 0, j;
  if (won) {   // 밤하늘이 환해짐

    sg.addColorStop(0, "rgba(255,246,216," + a + ")"); sg.addColorStop(1, "rgba(255,246,216,0)");
    ctx.fillStyle = sg; ctx.fillRect(0, 0, W, H);
  }
  for (j = 0; j < jars.length; j++) {
    var st = T - shake[j], sx = st < 320 ? Math.sin(st * 0.06) * 6 * (1 - st / 320) : 0;
    var bt = T - bump[j], by = bt < 220 ? Math.sin(bt / 220 * Math.PI) * 5 : 0;
    var done = isDone(jars[j]), dk = done ? clamp01((T - doneT[j]) / 500) : 0, lift = sel === j ? 1 - Math.pow(1 - clamp01((T - selT) / 170), 3) : 0;

    else { var d = (p - 0.55) / 0.45; x = fly.x1; y = lerp(HOVER_Y, fly.y1, d * d); }
    drawFly(ctx, x, y, fly.c, 1.2, 0);
    if (Math.random() < 0.6) particles.push({ x: x, y: y, vx: 0, vy: 0.01, g: 0, r: 2 + Math.random() * 2, color: COLS[fly.c], age: 0, life: 300 });
  }
  drawHint(); drawFx();
  if (won && wt > 200) {
    var k = Math.min(1, (wt - 200) / 260), s2 = k < 1 ? 0.5 + k * 0.7 : 1.2 - Math.min(0.2, (wt - 460) / 1500), txt = L("모두 밝혔어요!", "All aglow!");
    ctx.save(); ctx.translate(W / 2, 236); ctx.scale(s2, s2);
    ctx.font = "50px " + FONT; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
    ctx.shadowColor = rgba(COLS[0], 0.8); ctx.shadowBlur = 24;
    ctx.lineWidth = 10; ctx.strokeStyle = INK; ctx.strokeText(txt, 0, 0);
    ctx.fillStyle = COLS[0]; ctx.fillText(txt, 0, 0);

}

cv.addEventListener("pointerdown", function (e) {

  for (var j = 0; j < JAR_X.length; j++) if (Math.abs(p.x - JAR_X[j]) <= 54) { tapJar(j); return; }
});

// ---------- 일시정지 (광고가 화면에 안 보일 때) ----------
function setPaused(v) {
  paused = !!v;
  if (actx) { try { if (paused) actx.suspend(); else actx.resume(); } catch (e) {} }
}
document.addEventListener("visibilitychange", function () { setPaused(document.hidden); });

// ---------- 루프 ----------
var last = 0;
function frame(t) {
  var dt = Math.min(50, t - last); last = t;
  if (!paused) update(dt);
  draw();
  requestAnimationFrame(frame);
}

// ---------- 시작 (MRAID가 있으면 ready와 viewable을 기다림) ----------
var booted = false;
function boot() {
  if (booted) return;
  booted = true;
  fit();
  startLevel();
  last = performance.now();
  requestAnimationFrame(frame);
  if (window.gameReady) { try { window.gameReady(); } catch (e) {} }   // Mintegral
}
function start() {
  var go = function () { try { document.fonts.load("20px Jua", L("반짝", "Glow")).then(boot, boot); } catch (e) { boot(); } setTimeout(boot, 1500); };
  var m = window.mraid;
  if (!m) { go(); return; }
  var onReady = function () {
    try {
      m.addEventListener("viewableChange", function (v) { setPaused(!v); if (v) go(); });
      m.addEventListener("sizeChange", fit);
      if (m.isViewable()) go(); else setPaused(true);
    } catch (e) { go(); }
  };
  try { if (m.getState() === "loading") m.addEventListener("ready", onReady); else onReady(); } catch (e) { go(); }
}
fit();
start();

// 자동 검증용 (광고 동작과는 무관)
window.__playable = {
  state: function () { return { state: state, reason: endReason, jars: jars.map(function (j) { return j.join(""); }), sel: sel, moves: moves, taps: tapCount, hintJar: hintJar(), hint: hint, flying: !!fly }; },
  solveLen: function (lv) { return solve(lv.map(function (s) { return s.split("").map(Number); })).len; },
  step: function (ms) { while (ms > 0) { var d = Math.min(16, ms); update(d); ms -= d; } draw(); }
};
</script>
