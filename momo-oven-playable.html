<script>
"use strict";
// ================= 광고 설정 (광고망에 올리기 전에 여기만 바꾸면 됨) =================
var STORE_URL_ANDROID = "https://poiu1579-oss.github.io/playables/"; // 자리표시자
var STORE_URL_IOS = "https://poiu1579-oss.github.io/playables/";                             // 자리표시자
var STORE_URL = /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent) ? STORE_URL_IOS : STORE_URL_ANDROID;
var IDLE_MS = 12000;      // 이만큼 입력이 없으면 종료 카드
var MAX_DRAGS = 30;       // 이만큼 집으면 종료 카드 (정상 플레이는 9번)

var FORCE_LANG = "";      // "ko" 또는 "en"으로 고정. 비우면 브라우저 언어를 따름
// 고정 레벨: 4×4 칸의 단계(0 = 빈칸). 1 쿠키 → 2 도넛 → 3 컵케이크 → 4 조각 케이크 → 5 케이크
var LEVEL = [
  2, 1, 0, 2,
  0, 2, 1, 0,
  1, 0, 2, 2,
  2, 0, 0, 1];
// ==================================================================================

var qs = /[?&]lang=(ko|en)/.exec(location.search);
var LANG = FORCE_LANG || (qs ? qs[1] : (/^ko/i.test(navigator.language || "") ? "ko" : "en"));
function L(ko, en) { return LANG === "ko" ? ko : en; }
document.documentElement.lang = LANG;
document.title = L("모모의 오븐", "Momo's Oven");

// ---------- 광고망 연결 ----------
// 광고망별 통계 연결 지점 (start, first_merge, win, end, cta, replay)
function track(name) {}
function openStore() {
  track("cta");
  try {
    if (window.FbPlayableAd && FbPlayableAd.onCTAClick) { FbPlayableAd.onCTAClick(); return; }   // Meta
    if (window.ExitApi && ExitApi.exit) { ExitApi.exit(); return; }                               // Google Ads

  } catch (e) {}
  window.open(STORE_URL, "_blank");
}
window.gameStart = function () { setPaused(false); };   // Mintegral이 부름
window.gameClose = function () { setPaused(true); };

// ---------- 상수 ----------
var W = 450, H = 800, N = 4, CS = 92, GAP = 8, OX = 29, OY = 308, TOP_TIER = 5;
var FONT = "Jua, system-ui, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif";
var OUT = "#4a2c2a", CREAM = "#fff6e6", MINT = "#bfeee2", PINK = "#ff7fa6", YEL = "#ffd166";
var CTA_BTN = { x: 326, y: 12, w: 112, h: 40 };
function cellX(i) { return OX + (i % N) * (CS + GAP) + CS / 2; }
function cellY(i) { return OY + ((i / N) | 0) * (CS + GAP) + CS / 2; }
function cellAt(p) {
  var c = Math.floor((p.x - OX + GAP / 2) / (CS + GAP)), r = Math.floor((p.y - OY + GAP / 2) / (CS + GAP));
  return c < 0 || c >= N || r < 0 || r >= N ? -1 : r * N + c;
}

// ---------- 캔버스 ----------
var cv = document.getElementById("c"), ctx = cv.getContext("2d");
var gameEl = document.getElementById("game"), endEl = document.getElementById("end"), cardEl = document.getElementById("card");
function fit() {
  var iw = window.innerWidth || document.documentElement.clientWidth || W, ih = window.innerHeight || document.documentElement.clientHeight || H;
  var s = Math.min(iw / W, ih / H);
  gameEl.style.transform = "scale(" + s + ")";
  gameEl.style.left = (iw - W * s) / 2 + "px";
  gameEl.style.top = (ih - H * s) / 2 + "px";
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.max(1, Math.round(W * s * dpr));
  cv.height = Math.max(1, Math.round(H * s * dpr));
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  var land = iw > ih, cs = Math.min(1, land ? iw / 600 : iw / 350, land ? ih / 310 : ih / 560);
  cardEl.style.transform = "scale(" + cs + ")";
}
window.addEventListener("resize", fit);
window.addEventListener("orientationchange", function () { setTimeout(fit, 200); });

// ---------- 유틸 ----------
function rr(x, y, w, h, r, c) {
  c = c || ctx;
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp01(t) { return t < 0 ? 0 : t > 1 ? 1 : t; }
function inRect(p, b) { return p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h; }

// ---------- 소리 (합성. 첫 터치 뒤에만 켜짐) ----------
var actx = null, paused = false;
function unlockAudio() {
  if (actx) { if (actx.state === "suspended" && !paused) actx.resume(); return; }

  if (!AC) return;
  try { actx = new AC(); } catch (e) { actx = null; }
}
function sfx(freq, dur, type, vol, slide) {
  if (!actx || paused || actx.state !== "running") return;
  var t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
}
function seq(notes, gap, type, vol, dur) { notes.forEach(function (f, k) { setTimeout(function () { sfx(f, dur || 0.14, type, vol); }, k * gap); }); }

// ---------- 상태 ----------
var state = "boot", endReason = "", items = [], drag = null, merges = 0, drags = 0, best = 1;
var T = 0, lastInput = 0, startT = 0, winT = 0, particles = [], popups = [];

function startLevel() {
  items = [];
  LEVEL.forEach(function (t, i) { if (t) items.push({ tier: t, cell: i, x: cellX(i), y: cellY(i), born: T - 1000 + i * 30, shake: -1e9 }); });
  drag = null; merges = 0; drags = 0; best = Math.max.apply(null, LEVEL); endReason = ""; particles = []; popups = [];
  lastInput = startT = T;
  state = "play"; track("start");
}
function itemAt(cell) { for (var k = 0; k < items.length; k++) if (items[k].cell === cell) return items[k]; return null; }
// 안내: 가장 낮은 단계부터, 같은 단계 두 개 중 가장 가까운 짝
function hintPair() {
  for (var t = 1; t < TOP_TIER; t++) {
    var same = items.filter(function (it) { return it.tier === t; }), bp = null, bd = 1e9;
    for (var a = 0; a < same.length; a++) for (var b = a + 1; b < same.length; b++) {
      var d = Math.abs(cellX(same[a].cell) - cellX(same[b].cell)) + Math.abs(cellY(same[a].cell) - cellY(same[b].cell));
      if (d < bd) { bd = d; bp = [same[a], same[b]]; }
    }
    if (bp) return bp;
  }

// ---------- 갱신 ----------
function update(dt) {
  T += dt;
  var f = Math.min(1, dt * 0.02), k;
  for (k = 0; k < items.length; k++) {
    var it = items[k];
    if (drag && drag.it === it) continue;
    it.x += (cellX(it.cell) - it.x) * f; it.y += (cellY(it.cell) - it.y) * f;
  }
  if (state === "play") {
    if (T - lastInput > IDLE_MS && !drag) showEnd("idle");
    else if (T - startT > MAX_PLAY_MS && !drag) showEnd("time");
    else if (drags >= MAX_DRAGS && !drag) showEnd("drags");
  } else if (state === "win" && T - winT > END_DELAY_MS) showEnd("win");
  for (k = particles.length - 1; k >= 0; k--) {
    var p = particles[k];
    p.age += dt;
    if (p.age >= p.life) { particles.splice(k, 1); continue; }
    if (!p.ring) { p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; }
  }

}

// ---------- 루프 ----------

}

// ---------- 시작 (MRAID가 있으면 ready와 viewable을 기다림) ----------
var booted = false;
function boot() {
  if (booted) return;
  booted = true;
  fit();
  startLevel();
  last = performance.now();
  requestAnimationFrame(frame);
  if (window.gameReady) { try { window.gameReady(); } catch (e) {} }   // Mintegral
}
function start() {
  var go = function () { try { document.fonts.load("20px Jua", L("오븐", "Oven")).then(boot, boot); } catch (e) { boot(); } setTimeout(boot, 1500); };
  var m = window.mraid;
  if (!m) { go(); return; }
  var onReady = function () {
    try {
      m.addEventListener("viewableChange", function (v) { setPaused(!v); if (v) go(); });
      m.addEventListener("sizeChange", fit);
      if (m.isViewable()) go(); else setPaused(true);
    } catch (e) { go(); }
  };
  try { if (m.getState() === "loading") m.addEventListener("ready", onReady); else onReady(); } catch (e) { go(); }
}
fit();
start();

// 자동 검증용 (광고 동작과는 무관)
window.__playable = {
  state: function () {
    var p = state === "play" ? hintPair() : null;
    return { state: state, reason: endReason, merges: merges, drags: drags, best: best, items: items.map(function (it) { return it.cell + ":" + it.tier; }), hint: p ? [p[0].cell, p[1].cell] : null };
  },
  cellXY: function (i) { return [cellX(i), cellY(i)]; },
  step: function (ms) { while (ms > 0) { var d = Math.min(16, ms); update(d); ms -= d; } draw(); }
};
</script>
