// ---------- 상태 ----------
var state = "boot", endReason = "", tiles = [], tray = [], taps = 0, matches = 0, hintId = -1;

function startLevel() {

// 안내용: 지금 상태에서 끝까지 비울 수 있는 다음 타일을 깊이 우선으로 찾는다 (없으면 -1)

  for (i = 0; i < KINDS; i++) cnt0.push(0);

    tiles.forEach(function (u, b) { if (u.layer > t.layer && Math.abs(u.x - t.x) < TS && Math.abs(u.y - t.y) < TS) m |= 1 << b; });
    above.push(m);

  active().forEach(function (it) { cnt0[it.kind]++; total0++; });

    return out.sort(function (a, b) { return cnt[tiles[b].kind] - cnt[tiles[a].kind]; });   // 짝이 있는 것부터

}

// ---------- 갱신 ----------
function update(dt) {
  T += dt;
  var f = Math.min(1, dt * 0.018), k;
  for (k = 0; k < tray.length; k++) { var it = tray[k]; it.x += (slotX(k) - it.x) * f; it.y += (TRAY_Y - it.y) * f; it.s += (0.62 - it.s) * f; }

  for (k = tray.length - 1; k >= 0; k--) if (tray[k].clearAt && T >= tray[k].clearAt) {
    burst(tray[k].x, tray[k].y, 7, 0.7); tray.splice(k, 1); cleared = true;
  }
  if (cleared) {
    matches++;
    if (matches === 1) track("first_match");
    seq([660, 880, 1100], 60, "sine", 0.07, 0.12);
    popup(W / 2, TRAY_Y - 62, [L("좋아요!", "Nice!"), L("착착!", "Snap!"), L("멋져요!", "Great!")][matches % 3], RED, 26);
    if (state === "play" && left() === 0 && tray.length === 0) {
      state = "win"; winT = T; track("win");
      setTimeout(function () { seq([523, 659, 784, 1047, 1319], 100, "triangle", 0.09, 0.2); }, 200);
      burst(W / 2, 420, 110, 1.8);
    }
  }
  if (state === "play") {
    if (T - lastInput > IDLE_MS) showEnd("idle");
    else if (T - startT > MAX_PLAY_MS) showEnd("time");
    else if (taps >= MAX_TAPS) showEnd("taps");

    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
  }
  for (k = popups.length - 1; k >= 0; k--) if (T - popups[k].t0 > popups[k].life) popups.splice(k, 1);
}

// ---------- 그리기 (도형 포스터풍: 납작한 원색, 딱 떨어지는 그림자) ----------

  ctx.fillStyle = BLUE; ctx.beginPath(); ctx.moveTo(450, 480); ctx.lineTo(450, 800); ctx.lineTo(210, 800); ctx.closePath(); ctx.fill();
  ctx.fillStyle = RED; ctx.fillRect(0, 742, 150, 58);

  ctx.fillStyle = INK;
  for (var y = 0; y < 5; y++) for (var x = 0; x < 5; x++) { ctx.beginPath(); ctx.arc(26 + x * 14, 560 + y * 14, 2, 0, 6.283); ctx.fill(); }

  ctx.fillStyle = PAPER; rr(32, 254, 386, 284, 14); ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.stroke();

    ctx.fillStyle = INK; rr((W - tw) / 2 + 5, 176, tw, 46, 6); ctx.fill();
    ctx.fillStyle = "#ffffff"; rr((W - tw) / 2, 170, tw, 46, 6); ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = INK; ctx.fillText(txt, W / 2, 194);

  ctx.fillStyle = RED; rr(23, 23, 20, 20, 4); ctx.fill();

function drawFx() {

// ---------- 입력 ----------
cv.addEventListener("pointerdown", function (e) {
  unlockAudio();
  lastInput = T;
  var r = cv.getBoundingClientRect(), p = { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  if (inRect(p, { x: CTA_BTN.x - 6, y: 0, w: CTA_BTN.w + 16, h: 62 })) { openStore(); return; }
  if (state !== "play") return;
  for (var layer = 1; layer >= 0; layer--) for (var k = 0; k < tiles.length; k++) {
    var t = tiles[k];

  }

// ---------- 일시정지 (광고가 화면에 안 보일 때) ----------
function setPaused(v) {

  if (actx) { try { if (paused) actx.suspend(); else actx.resume(); } catch (e) {} }
}
document.addEventListener("visibilitychange", function () { setPaused(document.hidden); });

// ---------- 루프 ----------
var last = 0;
function frame(t) {

  if (!paused) update(dt);
  draw();
  requestAnimationFrame(frame);
}

// ---------- 시작 (MRAID가 있으면 ready와 viewable을 기다림) ----------
var booted = false;
function boot() {
  if (booted) return;
  booted = true;
  fit();
  startLevel();
  last = performance.now();
  requestAnimationFrame(frame);
  if (window.gameReady) { try { window.gameReady(); } catch (e) {} }   // Mintegral
}
function start() {
  var go = function () { try { document.fonts.load("20px Jua", L("모양", "Trio")).then(boot, boot); } catch (e) { boot(); } setTimeout(boot, 1500); };
  var m = window.mraid;
  if (!m) { go(); return; }
  var onReady = function () {
    try {
      m.addEventListener("viewableChange", function (v) { setPaused(!v); if (v) go(); });
      m.addEventListener("sizeChange", fit);
      if (m.isViewable()) go(); else setPaused(true);
    } catch (e) { go(); }
  };
  try { if (m.getState() === "loading") m.addEventListener("ready", onReady); else onReady(); } catch (e) { go(); }
}
fit();
start();

// 자동 검증용 (광고 동작과는 무관)
window.__playable = {
  state: function () {
    return { state: state, reason: endReason, left: left(), tray: tray.map(function (it) { return it.kind + (it.clearAt ? "*" : ""); }).join(""), taps: taps, matches: matches, hint: hintId,
      free: tiles.map(function (t, i) { return !t.gone && !covered(t) ? i : -1; }).filter(function (i) { return i >= 0; }) };
  },
  tileXY: function (i) { return [tiles[i].x, tiles[i].y]; },
  step: function (ms) { while (ms > 0) { var d = Math.min(16, ms); update(d); ms -= d; } draw(); }
};
