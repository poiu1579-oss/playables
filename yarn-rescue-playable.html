  "rpppprppppr",
  "rpppppppppr",
  ".rpppppppr.",
  "..rpppppr..",

  ".....r.....",

// ---------- 캔버스 ----------
var cv = document.getElementById("c"), ctx = cv.getContext("2d");
var gameEl = document.getElementById("game"), endEl = document.getElementById("end"), cardEl = document.getElementById("card");
var spriteCache = {};
function fit() {
  var iw = window.innerWidth || document.documentElement.clientWidth || W, ih = window.innerHeight || document.documentElement.clientHeight || H;
  var s = Math.min(iw / W, ih / H);
  gameEl.style.transform = "scale(" + s + ")";
  gameEl.style.left = (iw - W * s) / 2 + "px";
  gameEl.style.top = (ih - H * s) / 2 + "px";
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.max(1, Math.round(W * s * dpr));
  cv.height = Math.max(1, Math.round(H * s * dpr));
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  spriteCache = {};
  var land = iw > ih, cs = Math.min(1, land ? iw / 600 : iw / 350, land ? ih / 310 : ih / 560);

}
window.addEventListener("resize", fit);
window.addEventListener("orientationchange", function () { setTimeout(fit, 200); });

// ---------- 유틸 ----------
function mulberry32(a) {
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function hexRgb(h) { var n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function rgbHex(r, g, b) { return "#" + [r, g, b].map(function (v) { v = Math.max(0, Math.min(255, Math.round(v))).toString(16); return v.length < 2 ? "0" + v : v; }).join(""); }
function shade(hex, t) {
  var c = hexRgb(hex), r = c[0], g = c[1], b = c[2];
  if (t < 0) { r *= 1 + t; g *= 1 + t; b *= 1 + t; } else { r += (255 - r) * t; g += (255 - g) * t; b += (255 - b) * t; }
  return rgbHex(r, g, b);
}
function mixHex(a, b, t) { var A = hexRgb(a), B = hexRgb(b); return rgbHex(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t); }
function rr(x, y, w, h, r, c) {
  c = c || ctx;
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function lerp(a, b, t) { return a + (b - a) * t; }
function inRect(p, b) { return p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h; }

// ---------- 소리 (합성, 파일 없음. 첫 터치 뒤에만 켜짐) ----------
var actx = null, paused = false, lastPluck = 0;
function unlockAudio() {
  if (actx) { if (actx.state === "suspended" && !paused) actx.resume(); return; }
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try { actx = new AC(); } catch (e) { actx = null; }
}
function sfx(freq, dur, type, vol) {
  if (!actx || paused || actx.state !== "running") return;
  var t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
}
function seq(notes, gap, type, vol, dur) { notes.forEach(function (f, k) { setTimeout(function () { sfx(f, dur || 0.12, type, vol); }, k * gap); }); }

// ---------- 레벨 해석과 규칙 (시제품과 같음) ----------
function parseLevel() {
  var map = LEVEL.map, GH = map.length, GW = Math.max.apply(null, map.map(function (r) { return r.length; }));
  var chars = [], g = new Int8Array(GW * GH), r, c, i;
  for (i = 0; i < g.length; i++) g[i] = -1;
  for (r = 0; r < GH; r++) for (c = 0; c < GW; c++) {
    var ch = map[r][c] || ".";
    if (ch === ".") continue;
    var k = chars.indexOf(ch);
    if (k < 0) { k = chars.length; chars.push(ch); }
    g[r * GW + c] = k;
  }
  var byColor = chars.map(function () { return []; });
  for (i = 0; i < g.length; i++) if (g[i] >= 0) byColor[g[i]].push(i);
  var mid = (GW - 1) / 2;
  byColor.forEach(function (a) { a.sort(function (i, j) { return (Math.floor(j / GW) - Math.floor(i / GW)) || (Math.abs(i % GW - mid) - Math.abs(j % GW - mid)) || (i - j); }); });
  var cs = Math.min(32, Math.floor(Math.min(420 / GW, 370 / GH)));
  var total = 0; byColor.forEach(function (a) { total += a.length; });
  return { GW: GW, GH: GH, g: g, colors: chars.map(function (ch) { return PAL[ch]; }), byColor: byColor, total: total, cs: cs,
    ox: Math.round((W - GW * cs) / 2), oy: Math.round(BOARD_TOP + 8 + (BOARD_H - 16 - GH * cs) / 2), ar: LEVEL.a[0], ac: LEVEL.a[1] };
}
function isExposed(lv, g, i) {
  var GW = lv.GW, r = (i / GW) | 0, c = i - r * GW;
  return r === 0 || g[i - GW] < 0 || r === lv.GH - 1 || g[i + GW] < 0 || c === 0 || g[i - 1] < 0 || c === GW - 1 || g[i + 1] < 0;
}
function firstExposed(lv, g, c) {
  var a = lv.byColor[c];
  for (var k = 0; k < a.length; k++) if (g[a[k]] === c && isExposed(lv, g, a[k])) return a[k];
  return -1;
}
function countExposed(lv, g, c) {
  var a = lv.byColor[c], n = 0;
  for (var k = 0; k < a.length; k++) if (g[a[k]] === c && isExposed(lv, g, a[k])) n++;
  return n;
}
function pickPull(lv, g, slots, from) {
  for (var k = 0; k < SLOTS; k++) {
    var s = (from + k) % SLOTS, sp = slots[s];
    if (!sp || sp.rem <= 0 || sp.landed === false) continue;
    var i = firstExposed(lv, g, sp.c);
    if (i >= 0) return { s: s, i: i };
  }
  return null;
}
function computeDepth(lv, g) {
  var N = g.length, dep = new Int16Array(N), q = [], i;
  for (i = 0; i < N; i++) dep[i] = 9999;
  for (i = 0; i < N; i++) if (g[i] >= 0 && isExposed(lv, g, i)) { dep[i] = 0; q.push(i); }
  for (var h = 0; h < q.length; h++) {
    i = q[h]; var r = (i / lv.GW) | 0, c = i % lv.GW, nb = [];
    if (r > 0) nb.push(i - lv.GW); if (r < lv.GH - 1) nb.push(i + lv.GW); if (c > 0) nb.push(i - 1); if (c < lv.GW - 1) nb.push(i + 1);
    for (var k = 0; k < nb.length; k++) { var j = nb[k]; if (g[j] >= 0 && dep[j] > dep[i] + 1) { dep[j] = dep[i] + 1; q.push(j); } }
  }
  return dep;
}
function minDepths(lv, g) {
  var dep = computeDepth(lv, g), minD = lv.colors.map(function () { return 9999; });
  for (var i = 0; i < g.length; i++) if (g[i] >= 0) minD[g[i]] = Math.min(minD[g[i]], dep[i]);
  return minD;
}
// 안내용 봇: 지금 보이는 색을 우선, 없으면 가장 얕게 묻힌 색
function botColumn() {
  var fronts = cols.map(function (c) { return c.length ? c[0].c : -1; }), best = -1, bs = 0;
  fronts.forEach(function (c, i) { if (c < 0) return; var n = countExposed(lv, g, c); if (n > bs) { bs = n; best = i; } });
  if (best >= 0) return best;
  var minD = minDepths(lv, g), bd = 1e9;
  fronts.forEach(function (c, i) { if (c >= 0 && minD[c] < bd) { bd = minD[c]; best = i; } });
  return best;
}
function splitCount(n, lo, hi, rng) {
  var out = [];
  while (n > 0) {
    if (n <= hi) { out.push(n); break; }
    var t = lo + Math.floor(rng() * (hi - lo + 1));
    if (n - t < lo) t = n - lo;
    out.push(t); n -= t;
  }
  return out;
}
// 겉에 보이는 색의 실타래부터 세 줄에 차례로 나눠 준다 (시드 고정 → 매번 같은 배치)
function genColumns(lv) {
  var rng = mulberry32(LEVEL.seed), items = [];
  lv.byColor.forEach(function (cells, c) { splitCount(cells.length, LEVEL.cap[0], LEVEL.cap[1], rng).forEach(function (cap) { items.push({ c: c, cap: cap }); }); });
  var minD = minDepths(lv, lv.g), out = [[], [], []];
  items.slice().sort(function (a, b) { return minD[a.c] - minD[b.c] || a.c - b.c; }).forEach(function (it, k) { out[k % 3].push(it); });
  return out;
}

// ---------- 상태 ----------
var state = "boot", lv = null, g = null, left = 0, endReason = "";
var cols = [[], [], []], slots = [], rrPtr = 0, strands = [], finishing = [], particles = [], popups = [];
var T = 0, pullAcc = 0, stuckT = 0, rescue = null, lastInput = 0, startT = 0, tapCount = 0, firstTap = false;
var slotFlash = -1e9, shakeT = -1e9, windTip = false;

function startLevel() {
  lv = parseLevel(); g = lv.g.slice(); left = lv.total;
  cols = genColumns(lv).map(function (col, ci) { return col.map(function (d, k) {
    return { c: d.c, cap: d.cap, rem: d.cap, got: 0, x: COL_X[ci], y: QY[Math.min(k, 3)] + 30, s: QS[Math.min(k, 3)], landed: false, st: "queue", bump: -1e9, spin: 0, pullT: -1e9, inflight: 0 };
  }); });
  slots = [null, null, null, null, null]; rrPtr = 0; strands = []; finishing = []; particles = []; popups = [];
  pullAcc = 0; stuckT = 0; rescue = null; windTip = false; tapCount = 0; firstTap = false; endReason = "";
  lastInput = startT = T; spriteCache = {};
  state = "play";
  track("start");
}

function tapColumn(ci) {
  if (state !== "play") return false;
  var col = cols[ci];
  if (!col || !col.length) { sfx(130, 0.12, "square", 0.04); return false; }
  var free = slots.indexOf(null);
  if (free < 0) {
    sfx(130, 0.14, "square", 0.05); slotFlash = T;
    popup(W / 2, SLOT_Y - 58, L("자리가 꽉 찼어요!", "No free slot!"), UI.warn, 22);
    return false;
  }
  var sp = col.shift();
  sp.st = "fly"; sp.landed = false; sp.slot = free; sp.fx = sp.x; sp.fy = sp.y; sp.fs = sp.s; sp.ft = T;
  slots[free] = sp;
  sfx(420, 0.08, "triangle", 0.07); setTimeout(function () { sfx(640, 0.06, "sine", 0.05); }, 50);
  if (!firstTap) { firstTap = true; track("first_tap"); }
  return true;
}

function doPull() {
  var p = pickPull(lv, g, slots, rrPtr);
  if (!p) return;
  var sp = slots[p.s], i = p.i, c = g[i];
  g[i] = -1; left--; sp.rem--; sp.inflight++; sp.pullT = T;
  rrPtr = (p.s + 1) % SLOTS;
  var r = (i / lv.GW) | 0, cc = i % lv.GW;
  var x0 = lv.ox + (cc + 0.5) * lv.cs, y0 = lv.oy + (r + 0.5) * lv.cs;
  strands.push({ sp: sp, c: c, x0: x0, y0: y0, t0: T, bend: (Math.random() - 0.5) * 2 });
  for (var k = 0; k < 3; k++) particles.push({ kind: "dot", x: x0, y: y0, vx: (Math.random() - 0.5) * 0.12, vy: (Math.random() - 0.7) * 0.12,
    g: 0.0002, r: 1.5 + Math.random() * 2, color: shade(lv.colors[c], 0.3), age: 0, life: 420 });
  if (sp.rem === 0) { slots[p.s] = null; sp.st = "finish"; finishing.push(sp); }
}

function arrive(st) {
  var sp = st.sp;
  sp.got++; sp.inflight--; sp.bump = T;
  if (T - lastPluck > 40) { lastPluck = T; sfx(560 + (sp.got / sp.cap) * 620, 0.05, "sine", 0.035); }
  particles.push({ kind: "dot", x: sp.x + (Math.random() - 0.5) * 30, y: sp.y - 10, vx: (Math.random() - 0.5) * 0.1, vy: -0.08 - Math.random() * 0.06,
    g: 0.0002, r: 2, color: UI.cream, age: 0, life: 300 });
}

function celebrateSpool(sp) {
  var col = lv.colors[sp.c];
  particles.push({ kind: "ring", x: sp.x, y: sp.y, r0: 16, r1: 60, color: shade(col, 0.2), age: 0, life: 420 });
  for (var k = 0; k < 14; k++) {
    var a = Math.random() * Math.PI * 2, v = 0.12 + Math.random() * 0.2;
    particles.push({ kind: "dot", x: sp.x, y: sp.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 0.1, g: 0.0005,
      r: 2 + Math.random() * 3, color: k % 3 ? col : UI.cream, age: 0, life: 650 });
  }
  popup(sp.x, sp.y - 50, L("완성!", "Done!"), shade(col, -0.25), 20);
  seq([660, 880, 1175], 55, "sine", 0.06, 0.1);
  shakeT = T;
}

function startRescue() {
  state = "rescue"; track("win");
  var ax = lv.ox + (lv.ac + 0.5) * lv.cs, ay = lv.oy + (lv.ar + 0.5) * lv.cs, k, a, v;
  rescue = { t0: T, x: ax, y: ay, shown: false };
  for (k = 0; k < 8; k++) {   // 부서지는 나무 우리 조각
    a = -Math.PI / 2 + (Math.random() - 0.5) * 2.4; v = 0.25 + Math.random() * 0.2;
    particles.push({ kind: "conf", x: ax + (Math.random() - 0.5) * lv.cs * 2, y: ay, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
      g: 0.0009, w: 6, h: lv.cs * 1.6, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.02, color: k % 2 ? UI.wood : UI.wood2, age: 0, life: 1400 });
  }
  var confCols = [PAL.p, PAL.y, PAL.g, PAL.b, PAL.v, PAL.o];
  for (k = 0; k < 90; k++) {
    a = -Math.PI / 2 + (Math.random() - 0.5) * 2.2; v = 0.3 + Math.random() * 0.45;
    particles.push({ kind: "conf", x: W / 2 + (Math.random() - 0.5) * 120, y: 470, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
      g: 0.0008, w: 7, h: 11, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.03, color: confCols[k % 6], age: 0, life: 2200 + Math.random() * 600 });
  }
  seq([523, 659, 784, 1047, 1319], 90, "triangle", 0.08, 0.18);
}

function fail() {
  state = "fail"; track("fail"); slotFlash = T;
  seq([330, 262, 196], 140, "triangle", 0.06, 0.16);
  setTimeout(function () { if (state === "fail") showEnd("fail"); }, 800);
}

function popup(x, y, text, color, size) { popups.push({ x: x, y: y, text: text, color: color, size: size, t0: T, life: 900 }); }

// ---------- 종료 카드 ----------
function showEnd(reason) {
  if (state === "end") return;
  state = "end"; endReason = reason; track("end");
  if (window.gameEnd) { try { window.gameEnd(); } catch (e) {} }   // Mintegral
  var head = reason === "win" ? L("구조 완료!", "Rescued!") : reason === "fail" ? L("아깝다!", "So close!") : L("도와주세요!", "Help them!");
  var sub = reason === "win" ? L("털실에 갇힌 친구들이 더 있어요. 모두 구해 주세요!", "More friends are tangled in yarn. Rescue them all!")
    : reason === "fail" ? L("게임에서 다시 도전해 보세요!", "Try again in the full game!")
    : L("실타래를 눌러 실을 감고 동물을 구해 주세요!", "Tap spools, wind the yarn, free the animals!");
  document.getElementById("name").textContent = L("실타래 구조대", "Yarn Rescue");
  document.getElementById("head").textContent = head;
  document.getElementById("sub").textContent = sub;
  document.getElementById("cta").textContent = L("지금 설치", "Install Now");
  document.getElementById("again").textContent = L("다시 하기", "Play again");
  var cc = document.getElementById("catc").getContext("2d");
  cc.clearRect(0, 0, 300, 300);
  drawCat(cc, 150, 165, 250, reason === "win");
  endEl.classList.remove("hidden");
  setTimeout(function () { endEl.classList.add("on"); }, 20);
}
function hideEnd() { endEl.classList.remove("on"); endEl.classList.add("hidden"); }
document.getElementById("cta").addEventListener("click", openStore);
document.getElementById("again").addEventListener("click", function () { track("replay"); unlockAudio(); sfx(520, 0.08, "triangle", 0.06); hideEnd(); startLevel(); });

// ---------- 갱신 ----------
function update(dt) {
  T += dt;
  var k, sp;
  if (lv && state !== "boot" && state !== "end") {
    var f = Math.min(1, dt * 0.014);
    cols.forEach(function (col, ci) { col.forEach(function (sp, k) {
      var kk = Math.min(k, 3);
      sp.x += (COL_X[ci] - sp.x) * f; sp.y += (QY[kk] - sp.y) * f; sp.s += (QS[kk] - sp.s) * f;
    }); });
    for (k = 0; k < SLOTS; k++) {
      sp = slots[k];
      if (!sp || sp.st !== "fly") continue;
      var t = Math.min(1, (T - sp.ft) / FLY_MS), e = 1 - Math.pow(1 - t, 3), tx = slotX(sp.slot), ty = SLOT_Y;
      sp.x = lerp(sp.fx, tx, e); sp.y = lerp(sp.fy, ty, e) - Math.sin(Math.PI * t) * 70; sp.s = lerp(sp.fs, 0.92, e);
      if (t >= 1) {
        sp.st = "slot"; sp.landed = true; sp.bump = T; sp.x = tx; sp.y = ty;
        sfx(170, 0.09, "sine", 0.1);
        for (var q = 0; q < 6; q++) particles.push({ kind: "dot", x: tx + (Math.random() - 0.5) * 40, y: ty + 34, vx: (Math.random() - 0.5) * 0.15,
          vy: -Math.random() * 0.08, g: 0.0003, r: 2 + Math.random() * 2, color: "rgba(255,248,238,.8)", age: 0, life: 380 });
        if (!windTip) { windTip = true; popup(tx < 130 ? 130 : tx, SLOT_Y - 60, L("같은 색 실을 감아요!", "It winds its color!"), UI.plum, 20); }
      }
    }
    if (state === "play") {
      pullAcc += dt;
      while (pullAcc >= PULL_MS) { pullAcc -= PULL_MS; doPull(); }
    }
    for (k = strands.length - 1; k >= 0; k--) if (T - strands[k].t0 >= STRAND_MS) { arrive(strands[k]); strands.splice(k, 1); }
    for (k = 0; k < SLOTS; k++) { sp = slots[k]; if (sp && sp.landed && T - sp.pullT < 160) sp.spin += dt * 0.06; }
    for (k = finishing.length - 1; k >= 0; k--) {
      sp = finishing[k];
      if (T - sp.pullT < 160) sp.spin += dt * 0.06;
      if (sp.st === "finish" && sp.inflight === 0) { sp.st = "pop"; sp.popT = T; celebrateSpool(sp); }
      else if (sp.st === "pop" && T - sp.popT > 420) finishing.splice(k, 1);
    }
    if (state === "play") {
      if (left === 0 && strands.length === 0) startRescue();
      else {
        var full = slots.every(function (s) { return s && s.landed; });
        if (full && strands.length === 0 && !pickPull(lv, g, slots, rrPtr)) { stuckT += dt; if (stuckT > 650) fail(); }
        else stuckT = 0;
      }
    }
    if (state === "play") {
      if (T - lastInput > IDLE_MS) showEnd("idle");
      else if (T - startT > MAX_PLAY_MS) showEnd("time");
      else if (tapCount >= MAX_TAPS && strands.length === 0) showEnd("taps");
    }
    if (state === "rescue" && T - rescue.t0 > END_DELAY_MS) showEnd("win");
  }
  for (k = particles.length - 1; k >= 0; k--) {
    var p = particles[k];
    p.age += dt;
    if (p.age >= p.life) { particles.splice(k, 1); continue; }
    if (p.kind !== "ring") { p.vy += (p.g || 0) * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.vr) p.rot += p.vr * dt; }
  }
  for (k = popups.length - 1; k >= 0; k--) if (T - popups[k].t0 > popups[k].life) popups.splice(k, 1);
}

// ---------- 그리기 ----------
// 고양이 얼굴 (둥글고 통통하게, 외곽선 없음). s = 대략의 너비
function drawCat(c, x, y, s, happy) {
  c.save(); c.translate(x, y); c.scale(s / 100, s / 100);
  c.lineJoin = "round"; c.lineCap = "round";
  for (var sd = -1; sd <= 1; sd += 2) {
    c.fillStyle = c.strokeStyle = PAL.s; c.lineWidth = 9;

  last = performance.now();
  requestAnimationFrame(frame);
  if (window.gameReady) { try { window.gameReady(); } catch (e) {} }   // Mintegral
}
function start() {
  var go = function () { try { document.fonts.load("20px Jua", L("실타래", "Yarn")).then(boot, boot); } catch (e) { boot(); } setTimeout(boot, 1500); };
  var m = window.mraid;
  if (!m) { go(); return; }
  var onReady = function () {
    try {
      m.addEventListener("viewableChange", function (v) { setPaused(!v); if (v) go(); });
      m.addEventListener("sizeChange", fit);
      if (m.isViewable()) go(); else setPaused(true);
    } catch (e) { go(); }
  };
  try { if (m.getState() === "loading") m.addEventListener("ready", onReady); else onReady(); } catch (e) { go(); }
}
fit();
start();

// 자동 검증용 (광고 동작과는 무관)
window.__playable = {
  state: function () { return { state: state, reason: endReason, left: left, total: lv ? lv.total : 0, taps: tapCount, hint: hintColumn(), queues: cols.map(function (c) { return c.map(function (s) { return s.c + ":" + s.rem; }); }) }; },
  tap: function (i) { lastInput = T; tapCount++; return tapColumn(i); },
  step: function (ms) { while (ms > 0) { var d = Math.min(16, ms); update(d); ms -= d; } draw(); }
};
